<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix — Sign in</title>

<!--
  SETUP (one-time, do this before this page will work):

  1. Create a project at https://supabase.com (free tier is fine).
  2. Project Settings -> API: copy "Project URL" and the "anon public" key
     into CONFIG.SUPABASE_URL / CONFIG.SUPABASE_ANON_KEY below.
     The anon key is DESIGNED to be public/client-side — Supabase's own
     docs ship it in browser JS. It is not a secret like a normal API key;
     access control is enforced by Row Level Security (RLS) policies on
     your tables, not by hiding this key. So this does NOT violate the
     CLAUDE.md "never expose keys client-side, proxy instead" rule — that
     rule is about secret keys (the "service_role" key). NEVER put the
     service_role key in this file or any browser-facing code.
  3. Authentication -> Providers: make sure "Email" is enabled.
  4. Authentication -> URL Configuration: set "Site URL" to wherever this
     page is deployed on Netlify (e.g. https://your-site.netlify.app),
     and add it to "Redirect URLs" too — magic links won't come back to
     the right place otherwise.
  5. Optional for local testing: Authentication -> Providers -> Email ->
     turn OFF "Confirm email" so sign-up logs you in immediately instead
     of waiting on a confirmation email.
  6. Run supabase/schema.sql (repo root) in the Supabase SQL Editor to
     create the `technicians` / `technician_plant_access` tables and their
     RLS policies. Then use scripts/build_technician_seed.py to turn the
     roster spreadsheet into CSVs and import those via Table Editor.

  ACCESS MODEL: a technician signs up with email + password + their SM ID
  (e.g. "jcavanah", from the roster spreadsheet). The SM ID claims their
  pre-seeded `technicians` row by stamping this account's user_id onto it —
  first come, first served, and only once (see supabase/schema.sql). From
  then on, RLS scopes everything they can see to their own AMP plant
  numbers via `technician_plant_access`. If sign-up doesn't get an
  immediate session (email confirmation required), the SM ID they typed is
  remembered locally and the "link your account" step runs after they
  confirm and sign in.
-->

<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f4;
    --panel: #ffffff;
    --border: #ddd;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error: #b91c1c;
    --success: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --panel: #242427;
      --border: #3a3a3d;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin: 0 0 20px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    background: none;
    border: none;
    padding: 8px 4px;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 12px 0 4px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
  }
  button.primary {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-size: 0.85rem;
    min-height: 1.2em;
  }
  .status.error { color: var(--error); }
  .status.success { color: var(--success); }
  .session-card {
    text-align: center;
  }
  .session-card .who {
    font-weight: 600;
    margin: 8px 0 4px;
    word-break: break-all;
  }
  .session-card .email {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 20px;
    word-break: break-all;
  }
  button.secondary {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 10px;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card" id="card">
  <div id="authView">
    <h1>Sign in</h1>
    <p class="subtitle">Mix — DesignBook / PlantBook</p>

    <div class="tabs">
      <button class="tab active" data-mode="signin">Sign in</button>
      <button class="tab" data-mode="signup">Sign up</button>
      <button class="tab" data-mode="magic">Magic link</button>
    </div>

    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <div id="passwordField">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>

      <div id="smIdField" class="hidden">
        <label for="smId">SM ID</label>
        <input id="smId" type="text" autocomplete="off" placeholder="e.g. jcavanah">
        <p class="hint">From the technician roster — this links your login to your certifications and assigned plants.</p>
      </div>

      <button type="submit" class="primary" id="submitBtn">Sign in</button>
    </form>

    <div class="status" id="status"></div>
  </div>

  <div id="linkView" class="hidden">
    <h1>Link your account</h1>
    <p class="subtitle">One more step — enter your SM ID to connect your certifications and plants.</p>

    <form id="linkForm">
      <label for="linkSmId">SM ID</label>
      <input id="linkSmId" type="text" autocomplete="off" placeholder="e.g. jcavanah" required>
      <button type="submit" class="primary" id="linkSubmitBtn">Link account</button>
    </form>

    <div class="status" id="linkStatus"></div>
    <button class="secondary" id="linkSignOutBtn">Sign out</button>
  </div>

  <div id="sessionView" class="session-card hidden">
    <h1>Signed in</h1>
    <div class="who" id="sessionWho"></div>
    <div class="email" id="sessionEmail"></div>
    <button class="secondary" id="signOutBtn">Sign out</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- CONFIG -------------------------------------------------------
  // Fill these in once the Supabase project exists (see setup comment
  // at the top of this file). Nothing else in this file should need
  // to change for basic email/password + magic-link auth.
  const CONFIG = {
    SUPABASE_URL: "https://iwysxhcmvhkcjxmjarkd.supabase.co",
    SUPABASE_ANON_KEY:
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3eXN4aGNtdmhrY2p4bWphcmtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTE0MDUsImV4cCI6MjEwMzMyNzQwNX0.K_YKefS3p6W2ZVjEw8El88a_7y_SnLaYNnzF7BA3WKc",
    AUTH: {
      enablePassword: true,
      enableMagicLink: true,
      // Where Supabase sends the user back after a magic-link click.
      // Must be added to Supabase Auth -> URL Configuration -> Redirect URLs.
      redirectTo: window.location.origin + window.location.pathname,
    },
  };
  // ---------------------------------------------------------------------

  const PENDING_SM_ID_KEY = "mix_pending_sm_id";

  const isConfigured =
    CONFIG.SUPABASE_URL.startsWith("https://") &&
    !CONFIG.SUPABASE_URL.includes("YOUR-PROJECT") &&
    !CONFIG.SUPABASE_ANON_KEY.includes("YOUR-ANON");

  const statusEl = document.getElementById("status");
  const authView = document.getElementById("authView");
  const linkView = document.getElementById("linkView");
  const linkForm = document.getElementById("linkForm");
  const linkSmIdInput = document.getElementById("linkSmId");
  const linkSubmitBtn = document.getElementById("linkSubmitBtn");
  const linkStatusEl = document.getElementById("linkStatus");
  const linkSignOutBtn = document.getElementById("linkSignOutBtn");
  const sessionView = document.getElementById("sessionView");
  const sessionWho = document.getElementById("sessionWho");
  const sessionEmail = document.getElementById("sessionEmail");
  const form = document.getElementById("authForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const passwordField = document.getElementById("passwordField");
  const smIdField = document.getElementById("smIdField");
  const smIdInput = document.getElementById("smId");
  const submitBtn = document.getElementById("submitBtn");
  const tabs = document.querySelectorAll(".tab");
  const signOutBtn = document.getElementById("signOutBtn");

  let mode = "signin"; // "signin" | "signup" | "magic"

  function setStatus(message, kind) {
    statusEl.textContent = message || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function setLinkStatus(message, kind) {
    linkStatusEl.textContent = message || "";
    linkStatusEl.className = "status" + (kind ? " " + kind : "");
  }

  function applyMode(newMode) {
    mode = newMode;
    tabs.forEach((t) => t.classList.toggle("active", t.dataset.mode === mode));
    passwordField.classList.toggle("hidden", mode === "magic");
    passwordInput.required = mode !== "magic";
    smIdField.classList.toggle("hidden", mode !== "signup");
    smIdInput.required = mode === "signup";
    submitBtn.textContent =
      mode === "signin" ? "Sign in" : mode === "signup" ? "Create account" : "Send magic link";
    setStatus("");
  }

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => applyMode(tab.dataset.mode));
  });

  if (!isConfigured) {
    setStatus(
      "CONFIG.SUPABASE_URL / SUPABASE_ANON_KEY are still placeholders — see the setup comment at the top of login.html.",
      "error"
    );
    submitBtn.disabled = true;
  } else {
    const supabase = window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_ANON_KEY
    );

    // Attempts to claim a technicians row for the current signed-in user, via
    // the claim_technician() Postgres function (see supabase/schema.sql).
    // That has to be a function rather than a plain UPDATE + RLS policy:
    // Postgres requires a row to pass the table's SELECT policy before an
    // UPDATE can even see it, and an unclaimed row (user_id is null) can
    // never pass "user_id = auth.uid()" — so a plain UPDATE policy silently
    // updates 0 rows, always. claim_technician() is SECURITY DEFINER,
    // bypassing that catch-22 without exposing the unclaimed roster via a
    // loosened SELECT policy. Succeeds only once per SM ID — whoever claims
    // it first gets it, and nobody can re-claim it after.
    async function claimTechnicianRow(smId) {
      const trimmed = (smId || "").trim();
      if (!trimmed) return { ok: false, message: "Enter your SM ID." };

      const { data, error } = await supabase.rpc("claim_technician", { p_sm_id: trimmed });

      if (error) return { ok: false, message: error.message };
      if (!data || data.length === 0) {
        return {
          ok: false,
          message: "SM ID not found, or already linked to another account.",
        };
      }
      return { ok: true, technician: data[0] };
    }

    // Shows the right one of: sign-in form / link-your-SM-ID step / signed-in view.
    async function refreshView(session) {
      if (!session || !session.user) {
        authView.classList.remove("hidden");
        linkView.classList.add("hidden");
        sessionView.classList.add("hidden");
        return;
      }

      const { data: tech } = await supabase
        .from("technicians")
        .select("sm_id, first_name, last_name, company")
        .eq("user_id", session.user.id)
        .maybeSingle();

      authView.classList.add("hidden");

      if (tech) {
        linkView.classList.add("hidden");
        sessionView.classList.remove("hidden");
        sessionWho.textContent = `${tech.first_name} ${tech.last_name} — ${tech.company}`;
        sessionEmail.textContent = `${session.user.email} (SM ID: ${tech.sm_id})`;
        localStorage.removeItem(PENDING_SM_ID_KEY);
      } else {
        sessionView.classList.add("hidden");
        linkView.classList.remove("hidden");
        const pending = localStorage.getItem(PENDING_SM_ID_KEY);
        if (pending) linkSmIdInput.value = pending;
      }
    }

    supabase.auth.getSession().then(({ data }) => refreshView(data.session));
    supabase.auth.onAuthStateChange((_event, session) => refreshView(session));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const smId = smIdInput.value.trim();

      submitBtn.disabled = true;
      setStatus("Working…");

      try {
        if (mode === "signin") {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          setStatus("Signed in.", "success");
        } else if (mode === "signup") {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;

          if (smId) localStorage.setItem(PENDING_SM_ID_KEY, smId);

          if (data.session) {
            // Email confirmation is off, so we already have a session —
            // claim the technician row right now.
            const result = await claimTechnicianRow(smId);
            if (result.ok) {
              setStatus(
                `Account created and linked to ${result.technician.first_name} ${result.technician.last_name}.`,
                "success"
              );
            } else {
              setStatus(
                `Account created, but couldn't link SM ID yet: ${result.message}`,
                "error"
              );
            }
          } else {
            setStatus(
              "Account created. Check your email to confirm, then sign in to finish linking your SM ID.",
              "success"
            );
          }
        } else {
          const { error } = await supabase.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: CONFIG.AUTH.redirectTo },
          });
          if (error) throw error;
          setStatus("Magic link sent — check your email.", "success");
        }
      } catch (err) {
        setStatus(err.message || "Something went wrong.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    linkForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      linkSubmitBtn.disabled = true;
      setLinkStatus("Linking…");
      const result = await claimTechnicianRow(linkSmIdInput.value);
      if (result.ok) {
        setLinkStatus("");
        const { data } = await supabase.auth.getSession();
        await refreshView(data.session);
      } else {
        setLinkStatus(result.message, "error");
      }
      linkSubmitBtn.disabled = false;
    });

    async function signOut() {
      await supabase.auth.signOut();
      setStatus("Signed out.");
    }
    signOutBtn.addEventListener("click", signOut);
    linkSignOutBtn.addEventListener("click", signOut);
  }

  applyMode("signin");
</script>

</body>
</html>
