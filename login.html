<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix — Sign in</title>

<!--
  SETUP (one-time, do this before this page will work):

  1. Create a project at https://supabase.com (free tier is fine).
  2. Project Settings -> API: copy "Project URL" and the "anon public" key
     into CONFIG.SUPABASE_URL / CONFIG.SUPABASE_ANON_KEY below.
     The anon key is DESIGNED to be public/client-side — Supabase's own
     docs ship it in browser JS. It is not a secret like a normal API key;
     access control is enforced by Row Level Security (RLS) policies on
     your tables, not by hiding this key. So this does NOT violate the
     CLAUDE.md "never expose keys client-side, proxy instead" rule — that
     rule is about secret keys (the "service_role" key). NEVER put the
     service_role key in this file or any browser-facing code.
  3. Authentication -> Providers: make sure "Email" is enabled (it's still
     Supabase's email/password provider under the hood — see ACCESS MODEL
     below for why the technician never sees or types an email).
  4. Authentication -> Providers -> Email -> turn OFF "Confirm email".
     This is MANDATORY, not just for local testing: technician accounts use
     a made-up @technicians.mix.local address (see below) with no real
     inbox behind it, ever. If "Confirm email" is on, Supabase sends a
     confirmation link to that fake address, nobody receives it, and the
     account is stuck unconfirmed forever.
  5. Run supabase/schema.sql (repo root) in the Supabase SQL Editor to
     create the `technicians` / `technician_plant_access` tables and their
     RLS policies. Then use scripts/build_technician_seed.py to turn the
     roster spreadsheets into seed files and import those via Table Editor
     or SQL Editor.

  ACCESS MODEL: technicians are identified by SM ID (e.g. "jcavanah"), not
  email — the roster has no email addresses at all. Supabase Auth's
  password provider still needs *some* email internally, so this page
  fabricates one from the SM ID (CONFIG.AUTH.emailDomain, below) that the
  technician never sees or types — they only ever enter their SM ID and a
  password, for both sign-up and sign-in. Signing up also claims their
  pre-seeded `technicians` row by stamping this account's user_id onto it —
  first come, first served, and only once (see claim_technician() in
  supabase/schema.sql). From then on, RLS scopes everything they can see to
  their own AMP plant numbers and current certifications.
-->

<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f4;
    --panel: #ffffff;
    --border: #ddd;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error: #b91c1c;
    --success: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --panel: #242427;
      --border: #3a3a3d;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin: 0 0 20px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    background: none;
    border: none;
    padding: 8px 4px;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 12px 0 4px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
  }
  button.primary {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-size: 0.85rem;
    min-height: 1.2em;
  }
  .status.error { color: var(--error); }
  .status.success { color: var(--success); }
  .session-card {
    text-align: center;
  }
  .session-card .who {
    font-weight: 600;
    margin: 8px 0 4px;
    word-break: break-all;
  }
  .session-card .meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 16px;
    word-break: break-all;
  }
  .badges {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge.granted {
    background: color-mix(in srgb, var(--success) 18%, transparent);
    color: var(--success);
  }
  .badge.denied {
    background: color-mix(in srgb, var(--muted) 18%, transparent);
    color: var(--muted);
    text-decoration: line-through;
  }
  button.secondary {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 10px;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card" id="card">
  <div id="authView">
    <h1>Sign in</h1>
    <p class="subtitle">Mix — DesignBook / PlantBook</p>

    <div class="tabs">
      <button class="tab active" data-mode="signin">Sign in</button>
      <button class="tab" data-mode="signup">Sign up</button>
    </div>

    <form id="authForm">
      <label for="smId">SM ID</label>
      <input id="smId" type="text" autocomplete="username" placeholder="e.g. jcavanah" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <div id="confirmPasswordField" class="hidden">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password">
      </div>

      <p id="signupHint" class="hint hidden">
        Your SM ID is from the technician roster — it links your login to your
        certifications and assigned plants. You don't need an email address.
      </p>

      <button type="submit" class="primary" id="submitBtn">Sign in</button>
    </form>

    <div class="status" id="status"></div>
  </div>

  <div id="sessionView" class="session-card hidden">
    <h1>Signed in</h1>
    <div class="who" id="sessionWho"></div>
    <div class="meta" id="sessionMeta"></div>
    <div class="badges" id="sessionAccess"></div>
    <button class="secondary" id="signOutBtn">Sign out</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- CONFIG -------------------------------------------------------
  // Fill these in once the Supabase project exists (see setup comment
  // at the top of this file).
  const CONFIG = {
    SUPABASE_URL: "https://iwysxhcmvhkcjxmjarkd.supabase.co",
    SUPABASE_ANON_KEY:
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3eXN4aGNtdmhrY2p4bWphcmtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTE0MDUsImV4cCI6MjEwMzMyNzQwNX0.K_YKefS3p6W2ZVjEw8El88a_7y_SnLaYNnzF7BA3WKc",
    AUTH: {
      // Supabase's password provider needs an email internally; the
      // technician never sees this. sm_id -> `${sm_id}@emailDomain`,
      // always lowercased + trimmed first so casing/whitespace typed at
      // sign-in always reconstructs the same address used at sign-up.
      emailDomain: "technicians.mix.local",
    },
  };
  // ---------------------------------------------------------------------

  const isConfigured =
    CONFIG.SUPABASE_URL.startsWith("https://") &&
    !CONFIG.SUPABASE_URL.includes("YOUR-PROJECT") &&
    !CONFIG.SUPABASE_ANON_KEY.includes("YOUR-ANON");

  function normalizeSmId(raw) {
    return (raw || "").trim().toLowerCase();
  }

  function smIdToEmail(smId) {
    return `${smId}@${CONFIG.AUTH.emailDomain}`;
  }

  const statusEl = document.getElementById("status");
  const authView = document.getElementById("authView");
  const sessionView = document.getElementById("sessionView");
  const sessionWho = document.getElementById("sessionWho");
  const sessionMeta = document.getElementById("sessionMeta");
  const sessionAccess = document.getElementById("sessionAccess");
  const form = document.getElementById("authForm");
  const smIdInput = document.getElementById("smId");
  const passwordInput = document.getElementById("password");
  const confirmPasswordField = document.getElementById("confirmPasswordField");
  const confirmPasswordInput = document.getElementById("confirmPassword");
  const signupHint = document.getElementById("signupHint");
  const submitBtn = document.getElementById("submitBtn");
  const tabs = document.querySelectorAll(".tab");
  const signOutBtn = document.getElementById("signOutBtn");

  let mode = "signin"; // "signin" | "signup"

  function setStatus(message, kind) {
    statusEl.textContent = message || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function applyMode(newMode) {
    mode = newMode;
    tabs.forEach((t) => t.classList.toggle("active", t.dataset.mode === mode));
    confirmPasswordField.classList.toggle("hidden", mode !== "signup");
    confirmPasswordInput.required = mode === "signup";
    signupHint.classList.toggle("hidden", mode !== "signup");
    passwordInput.autocomplete = mode === "signup" ? "new-password" : "current-password";
    submitBtn.textContent = mode === "signin" ? "Sign in" : "Create account";
    setStatus("");
  }

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => applyMode(tab.dataset.mode));
  });

  if (!isConfigured) {
    setStatus(
      "CONFIG.SUPABASE_URL / SUPABASE_ANON_KEY are still placeholders — see the setup comment at the top of login.html.",
      "error"
    );
    submitBtn.disabled = true;
  } else {
    const supabase = window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_ANON_KEY
    );

    // Claims a technicians row for the current signed-in user, via the
    // claim_technician() Postgres function (see supabase/schema.sql). That
    // has to be a function rather than a plain UPDATE + RLS policy:
    // Postgres requires a row to pass the table's SELECT policy before an
    // UPDATE can even see it, and an unclaimed row (user_id is null) can
    // never pass "user_id = auth.uid()" — so a plain UPDATE policy silently
    // updates 0 rows, always. claim_technician() is SECURITY DEFINER,
    // bypassing that catch-22 without exposing the unclaimed roster via a
    // loosened SELECT policy. Succeeds only once per SM ID — whoever claims
    // it first gets it, and nobody can re-claim it after.
    async function claimTechnicianRow(smId) {
      const { data, error } = await supabase.rpc("claim_technician", { p_sm_id: smId });

      if (error) return { ok: false, message: error.message };
      if (!data || data.length === 0) {
        return {
          ok: false,
          message: "SM ID not found, or already linked to another account.",
        };
      }
      return { ok: true, technician: data[0] };
    }

    // Shows the right one of: sign-in/sign-up form, or the signed-in view.
    async function refreshView(session) {
      if (!session || !session.user) {
        authView.classList.remove("hidden");
        sessionView.classList.add("hidden");
        return;
      }

      const { data: tech } = await supabase
        .from("technicians")
        .select("sm_id, first_name, last_name, company")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (!tech) {
        // Shouldn't normally happen (claim runs right after sign-up, and
        // "Confirm email" must stay off per the setup comment above) — but
        // if it does, there's no real inbox to wait on, so say so plainly
        // rather than showing a "check your email" dead end.
        authView.classList.remove("hidden");
        sessionView.classList.add("hidden");
        setStatus(
          "Signed in, but not linked to a technician yet. Try signing up again with your SM ID, or check that Supabase Auth's \"Confirm email\" is off.",
          "error"
        );
        return;
      }

      authView.classList.add("hidden");
      sessionView.classList.remove("hidden");
      sessionWho.textContent = `${tech.first_name} ${tech.last_name} — ${tech.company}`;
      sessionMeta.textContent = `SM ID: ${tech.sm_id}`;

      // technician_capabilities (see supabase/schema.sql) is what decides
      // which book(s) this technician can see: Plant Tech alone -> only
      // PlantBook; Plant Tech + Mix Design Tech -> both. Gated on the
      // certification currently being unexpired, not just held at some
      // point - a lapsed cert drops that access until the roster is
      // updated and re-seeded. This is the same query the eventual
      // DesignBook/PlantBook app should run to decide what to show.
      const { data: caps } = await supabase
        .from("technician_capabilities")
        .select("can_access_plantbook, can_access_designbook")
        .eq("user_id", session.user.id)
        .maybeSingle();

      sessionAccess.innerHTML = "";
      const badge = (label, granted) => {
        const el = document.createElement("span");
        el.className = "badge " + (granted ? "granted" : "denied");
        el.textContent = label;
        return el;
      };
      sessionAccess.appendChild(badge("PlantBook", caps?.can_access_plantbook));
      sessionAccess.appendChild(badge("DesignBook", caps?.can_access_designbook));
    }

    supabase.auth.getSession().then(({ data }) => refreshView(data.session));
    supabase.auth.onAuthStateChange((_event, session) => refreshView(session));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const smId = normalizeSmId(smIdInput.value);
      const password = passwordInput.value;
      const email = smIdToEmail(smId);

      submitBtn.disabled = true;
      setStatus("Working…");

      try {
        if (mode === "signin") {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          setStatus("Signed in.", "success");
        } else {
          if (password !== confirmPasswordInput.value) {
            throw new Error("Passwords don't match.");
          }

          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;

          if (data.session) {
            const result = await claimTechnicianRow(smId);
            if (result.ok) {
              setStatus(
                `Account created and linked to ${result.technician.first_name} ${result.technician.last_name}.`,
                "success"
              );
            } else {
              setStatus(
                `Account created, but couldn't link SM ID yet: ${result.message}`,
                "error"
              );
            }
          } else {
            // No immediate session means Supabase Auth is waiting on email
            // confirmation - which will never arrive, since this address
            // isn't real. See the setup comment: "Confirm email" must be off.
            setStatus(
              "Account created, but no active session came back. Check that Supabase Auth's \"Confirm email\" setting is turned off.",
              "error"
            );
          }
        }
      } catch (err) {
        setStatus(err.message || "Something went wrong.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    signOutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      setStatus("Signed out.");
    });
  }

  applyMode("signin");
</script>

</body>
</html>
